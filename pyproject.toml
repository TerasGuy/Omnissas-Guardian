[project]
name = "omnissa-archive"
version = "0.1.0"
description = "Local archive of public Omnissa docs and knowledge-base articles."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "playwright>=1.49",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
omnissa-archive = "omnissa_archive.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
